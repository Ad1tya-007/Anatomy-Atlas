name: Update visual snapshots

# Run this from the Actions tab after an intentional visual change. It regenerates the Linux
# screenshot baselines in the same container CI uses and commits them to the selected branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test e2e/visual.spec.ts --project desktop --update-snapshots
      - name: Commit changed baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test: update Linux visual baselines"
            git push
          fi
